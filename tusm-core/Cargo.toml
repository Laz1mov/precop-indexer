[package]
name = "tusm-core"
version = "1.1.0-rc3"
edition = "2021"
license = "AGPL-3.0-only"
description = "Canonical Layer 1 consensus engine and Taproot geometry evaluator"

[dependencies]
bitcoin = { version = "0.30", default-features = false, features = ["std", "rand", "serde"] }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
primitive-types = { version = "0.10.0", default-features = false, features = ["std"] }
lazy_static = "1.5.0"
[dev-dependencies]
criterion = "0.4"
proptest = "1.4"

[[bench]]
name = "core_crypto_bench"
harness = false

[[bench]]
name = "consensus_throughput_bench"
harness = false
