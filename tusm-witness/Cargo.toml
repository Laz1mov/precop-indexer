[package]
name = "tusm-witness"
version = "1.1.0-rc3"
edition = "2021"
license = "AGPL-3.0-only"
description = "Lightweight cryptographic witness and Utreexo accumulator verifier"

[dependencies]
bitcoin = { version = "0.30.0", features = ["serde"] }
bitcoin_hashes = "1.1.0"
hex = "0.4.3"
rustreexo = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
