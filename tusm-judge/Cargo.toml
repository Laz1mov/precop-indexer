[package]
name = "tusm-judge"
version = "1.1.0-rc3"
edition = "2021"
license = "AGPL-3.0-only"
description = "WebAssembly universal transaction validator and covenant verification judge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
tusm-core = { path = "../tusm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
bitcoin = "0.30.0"
